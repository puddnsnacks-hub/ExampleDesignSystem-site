<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components/bundle.css">
<script>document.documentElement.setAttribute("data-theme", new URLSearchParams(location.search).get("theme") || "light");</script>
<script src="../design-system/components/bundle.js"></script>
<meta charset="utf-8">
<title>Icon</title>
<style>
html, body { margin: 0; }
body { min-height: 100vh; }
.xp { padding: var(--s-space-xl); }
.xp-bare { padding: 0; }
.xp-bare .cap { padding-inline: var(--s-space-xl); box-sizing: border-box; }
.xp-note { margin: 0 0 var(--s-space-base); }
.xp-bare .xp-note { padding-block-start: var(--s-space-base); }
.row { display: flex; flex-wrap: wrap; gap: var(--s-space-md); align-items: center; margin-bottom: var(--s-space-md); }
.row:last-child { margin-bottom: 0; }
.stack { display: flex; flex-direction: column; gap: var(--s-space-md); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-space-xl); }
.grid2 > * { min-width: 0; }
@media (max-width: 720px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.cap { width: 100%; margin: calc(-1 * var(--s-space-xs)) 0 0; font-family: var(--s-font-family-doc-mono), ui-monospace, monospace; font-size: var(--s-type-code-sm-size); color: var(--s-color-text-tertiary); }
</style>
</head>
<body class="xds-page">
<main class="xp">
<div class="stack" style="gap:20px">
      <p class="cap" style="margin:0">data-size · the five rungs</p>
      <div class="row" style="align-items:flex-end;gap:24px"><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-size="sm" aria-hidden="true"><use href="#xds-lock"></use></svg><figcaption class="cap" style="margin:0">sm</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-size="md" aria-hidden="true"><use href="#xds-lock"></use></svg><figcaption class="cap" style="margin:0">md</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-size="lg" aria-hidden="true"><use href="#xds-lock"></use></svg><figcaption class="cap" style="margin:0">lg</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-size="xl" aria-hidden="true"><use href="#xds-lock"></use></svg><figcaption class="cap" style="margin:0">xl</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-size="2xl" aria-hidden="true"><use href="#xds-lock"></use></svg><figcaption class="cap" style="margin:0">2xl</figcaption></figure></div>
      <p class="cap" style="margin:0">data-tone · an override, not the default</p>
      <div class="row" style="gap:20px"><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="default" aria-hidden="true"><use href="#xds-file"></use></svg><span class="cap" style="margin:0">default</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="secondary" aria-hidden="true"><use href="#xds-file"></use></svg><span class="cap" style="margin:0">secondary</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="tertiary" aria-hidden="true"><use href="#xds-file"></use></svg><span class="cap" style="margin:0">tertiary</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="disabled" aria-hidden="true"><use href="#xds-file"></use></svg><span class="cap" style="margin:0">disabled</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="action" aria-hidden="true"><use href="#xds-download"></use></svg><span class="cap" style="margin:0">action</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="accent" aria-hidden="true"><use href="#xds-quote"></use></svg><span class="cap" style="margin:0">accent</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><span class="xds-button" data-variant="primary" data-icon="only" data-size="sm" aria-hidden="true"><svg class="xds-icon" data-tone="on-action" aria-hidden="true"><use href="#xds-file"></use></svg></span><span class="cap" style="margin:0">on-action</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="error" aria-hidden="true"><use href="#xds-error"></use></svg><span class="cap" style="margin:0">error</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="warning" aria-hidden="true"><use href="#xds-warning"></use></svg><span class="cap" style="margin:0">warning</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="success" aria-hidden="true"><use href="#xds-success"></use></svg><span class="cap" style="margin:0">success</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="info" aria-hidden="true"><use href="#xds-info"></use></svg><span class="cap" style="margin:0">info</span></span><span style="display:inline-flex;flex-direction:column;align-items:center;gap:8px"><svg class="xds-icon" data-tone="emergency" aria-hidden="true"><use href="#xds-emergency"></use></svg><span class="cap" style="margin:0">emergency</span></span></div>
      <p class="cap" style="margin:0">data-inline · 1em, on the text baseline</p>
      <p class="xds-text" data-role="body-md">Read the notice <svg class="xds-icon" data-inline role="img" aria-label="Opens in a new tab"><use href="#xds-external"></use></svg> before the docket closes <svg class="xds-icon" data-inline aria-hidden="true"><use href="#xds-calendar"></use></svg> on October 1.</p>
    </div>
</main>
<script>
(function () {
  /* Dark surface theme: a dark-capable component carries data-surface="dark", as the system's own dark
     specimens do; a light-only component has no dark variant, so its preview stays light and says so. */
  var DARK = ".xds-prose,.xds-paper,.xds-button,.xds-link,.xds-label,.xds-checkbox,.xds-radio,.xds-switch,.xds-chip,.xds-divider,.xds-field,.xds-button-group,.xds-card,.xds-tile,.xds-summary-box,.xds-menu,.xds-disclosure,.xds-accordion,.xds-reference-list,.xds-gov-banner,.xds-breadcrumb,.xds-in-page-nav,.xds-text,.xds-icon,.xds-eyebrow,.xds-section-heading,.xds-pull-quote,.xds-stat,.xds-section-opener,.xds-objective,.xds-header,.xds-hero,.xds-modal,.xds-footer";
  var PINNED = "[data-surface=\"light\"], [data-panel=\"light\"], .xds-header__mega, .xds-header__menu";
  var LIGHT_ONLY = false;
  var root = document.documentElement, main = document.querySelector("main"), mine = false;
  function note(on) {
    var n = document.getElementById("xp-note");
    if (on && !n) { n = document.createElement("p"); n.id = "xp-note"; n.className = "cap xp-note"; n.textContent = "Light only: no dark variant. It stays light on a dark ground."; main.insertBefore(n, main.firstChild); }
    if (!on && n) n.remove();
  }
  function apply() {
    if (mine) { mine = false; return; }
    var theme = root.getAttribute("data-theme");
    if (LIGHT_ONLY) {
      if (theme === "dark") { mine = true; root.setAttribute("data-theme", "light"); root.style.colorScheme = "light"; note(true); }
      else note(false);
      return;
    }
    document.querySelectorAll(DARK).forEach(function (el) {
      if (theme === "dark") {
        if (!el.hasAttribute("data-surface") && !el.closest(PINNED)) { el.setAttribute("data-surface", "dark"); el.setAttribute("data-xp-stamped", ""); }
      } else if (el.hasAttribute("data-xp-stamped")) { el.removeAttribute("data-surface"); el.removeAttribute("data-xp-stamped"); }
    });
  }
  document.querySelectorAll(".indet").forEach(function (i) { i.indeterminate = true; });
  apply();
  new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
</body>
</html>
